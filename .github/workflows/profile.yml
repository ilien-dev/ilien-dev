name: Redraw profile images

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/profile.yml']

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render
        env:
          # PROFILE_TOKEN (a personal token with read:user) also counts private
          # contributions. Without it the numbers are the public ones.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: node scripts/render.mjs
      - name: Commit
        run: |
          if [ -n "$(git status --porcelain assets)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets
            git commit -m "Redraw the profile images"
            git push
          fi
